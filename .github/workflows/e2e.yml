# Written by `e2e init --ci github-actions`: the e2e tests on every pull request
# and every push to main, one job per platform. See https://e2e.com/docs/ci/github-actions
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-26
    # A Release build for the simulator alone can take 35 minutes on this runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Expo generates ios/ (CNG): expo run:ios prebuilds it, installs the pods, and builds without a simulator.
      - name: Build the app
        run: pnpm exec expo run:ios --configuration Release --device generic --no-bundler --output build/ios
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Boots the image's own iPhone 17 Pro on a pinned runtime: a simulator made with `simctl create`
      # can spend minutes on its first boot. Bump the runtime on purpose, after a local run on it,
      # since the accessibility tree changes between iOS releases.
      - name: Boot a simulator and install the app
        env:
          IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$IOS_RUNTIME" '.devices[$rt][]? | select(.name == "iPhone 17 Pro") | .udid' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone 17 Pro on $IOS_RUNTIME"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          APP=$(find build -maxdepth 5 -name '*.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app under build/"
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"
          # A target with device: process.env.E2E_DEVICE drives this simulator, whatever else the image has.
          echo "E2E_DEVICE=$UDID" >> "$GITHUB_ENV"

      - name: Run e2e
        run: pnpm exec e2e run --target ios --workers 1 --reporter list,junit

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ios
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
          # .e2e is a hidden directory, which upload-artifact skips when it expands a folder.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
